name: Mise a jour taux Bank Al-Maghrib

on:
  schedule:
    - cron: '45 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-bam-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Interroger API Bank Al-Maghrib
        env:
          BAM_KEY: ${{ secrets.BAM_API_KEY }}
        run: |
          python3 -c '
          import os, json, urllib.request
          from datetime import datetime

          url = "https://centralbankofmorocco.ma"
          req = urllib.request.Request(url, headers={
              "Ocp-Apim-Subscription-Key": os.environ["BAM_KEY"],
              "Cache-Control": "no-cache"
          })

          with urllib.request.urlopen(req, timeout=20) as res:
              data = json.loads(res.read().decode("utf-8"))

          rates = {}
          for item in data:
              code = item.get("libDevise")
              unite = float(item.get("uniteDevise", 1))
              achat = float(item.get("achatClientele", 0)) / unite
              vente = float(item.get("venteClientele", 0)) / unite
              if code in ["EUR", "USD", "GBP", "CAD", "CHF", "SAR", "AED"]:
                  rates[code] = {
                      "achat": round(achat, 4),
                      "vente": round(vente, 4)
                  }

          output = {
              "updated_at": datetime.now().strftime("%d/%m/%Y %H:%M"),
              "source": "Bank Al-Maghrib",
              "rates": rates
          }
          with open("rates.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, ensure_ascii=False)
          print("OK :", output)
          '

      - name: Sauvegarder rates.json
        run: |
          git config user.name "YET-CHANGE Bot"
          git config user.email "bot@yetchange.ma"
          git add rates.json
          git commit -m "Mise a jour automatique taux BAM" || exit 0
          git push
