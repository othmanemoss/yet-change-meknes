    CURS.forEach(c => {
      const x = d.rates && d.rates[c];
      if (x && +x.achat > 0 && +x.vente > 0) { rates[c] = { achat: +x.achat, vente: +x.vente }; ok++; } else rates[c] = MANUAL_RATES[c];
    });
    if (!ok) throw new Error("Aucun taux valide");
    state = { rates, updated_at: d.updated_at || new Date().toISOString(), live: true };
    renderRates(); fillAlert();
  } catch (e) { console.warn("Cours API indisponibles, taux de secours utilisés :", e.message); }
}

function renderRates() {
  let names = null;
  try { names = new Intl.DisplayNames([LOC[lang]], { type: "currency" }); } catch (e) {}
  $("#rows").innerHTML = CURS.map(c => {
    const r = state.rates[c], name = (names && names.of(c)) || c;
    return `<tr class="border-t border-slate-100">
      <td class="px-3 py-3 sm:px-6"><div class="flex items-center gap-2.5">
        <span class="text-2xl leading-none" aria-hidden="true">${FLAGS[c]}</span>
        <div class="leading-tight"><div class="font-bold">${c}</div><div class="hidden text-xs text-slate-500 sm:block">${name}</div></div></div></td>
      <td class="tnum px-1 py-3 text-end text-base font-bold sm:px-3 sm:text-lg">${fmt(r.achat)}</td>
      <td class="tnum px-1 py-3 text-end text-base font-bold text-emerald-700 sm:px-3 sm:text-lg">${fmt(r.vente)}</td>
    </tr>`;
  }).join("");
  let d = "";
  try {
    const dt = new Date(state.updated_at);
    if (!isNaN(dt)) d = new Intl.DateTimeFormat(LOC[lang], { dateStyle: "medium", timeStyle: "short", timeZone: "Africa/Casablanca" }).format(dt);
  } catch (e) {}
  $("#updated").textContent = d ? T("updated", { d }) : "";
  $("#src").classList.toggle("hidden", state.live);
}

/* ---- Alerte meilleur taux (envoi par WhatsApp) ---- */
function fillAlert() {
  const c = $("#alCur").value || CURS[0], o = $("#alOp").value || "achat";
  $("#alCur").innerHTML = CURS.map(x => `<option>${x}</option>`).join("");
  $("#alOp").innerHTML = `<option value="achat">${T("op_sell")}</option><option value="vente">${T("op_buy")}</option>`;
  $("#alCur").value = c; $("#alOp").value = o; alertHint();
}
function alertHint() { $("#alNow").textContent = T("al_now", { r: fmt(state.rates[$("#alCur").value][$("#alOp").value]) }); }
$("#alCur").onchange = alertHint; $("#alOp").onchange = alertHint;
$("#alertForm").addEventListener("submit", e => {
  e.preventDefault();
  const c = $("#alCur").value, op = $("#alOp"), t = num($("#alTarget").value);
  if (!(t > 0)) { $("#alTarget").focus(); return; }
  const msg = T("al_msg", { c, o: op.options[op.selectedIndex].text, t: fmt(t), r: fmt(state.rates[c][op.value]), n: $("#alName").value.trim() }).trim();
  window.open(waLink(msg), "_blank", "noopener");
});

/* ---- Statut Ouvert / Fermé (Africa/Casablanca) ---- */
function nowMorocco() {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Casablanca", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { day: { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[g("weekday")], min: (parseInt(g("hour"), 10) % 24) * 60 + parseInt(g("minute"), 10) };
}
function getStatus() {
  const { day, min } = nowMorocco(), days = I18N[lang].days;
  for (const [o, c] of HOURS[day] || []) if (min >= toMin(o) && min < toMin(c)) return { open: true, sub: T("closes", { t: c }) };
  for (let i = 0; i < 8; i++) {
    const d = (day + i) % 7;
    for (const [o] of HOURS[d] || []) if (i > 0 || toMin(o) > min) return { open: false, sub: T("opens", { w: i === 0 ? T("today") : i === 1 ? T("tomorrow") : days[d], t: o }) };
  }
  return { open: false, sub: "" };
}
function updateStatus() {
  const s = getStatus(), today = nowMorocco().day, label = T(s.open ? "open" : "closed");
  const cls = "items-center gap-2 rounded-full px-3 py-1 text-sm font-semibold ring-1 " + (s.open ? "bg-emerald-50 text-emerald-800 ring-emerald-200" : "bg-rose-50 text-rose-800 ring-rose-200");
  const dot = `<span class="h-2 w-2 rounded-full ${s.open ? "animate-pulse bg-emerald-500" : "bg-rose-500"}"></span>`;
  document.querySelectorAll("[data-pill]").forEach(el => { el.className = "inline-flex " + cls + (el.dataset.m ? " max-sm:hidden" : ""); el.innerHTML = dot + label; });
  document.querySelectorAll("[data-pill-full]").forEach(el => { el.className = "inline-flex " + cls; el.innerHTML = dot + label + (s.sub ? " : " + s.sub : ""); });
  $("#hours").innerHTML = [1, 2, 3, 4, 5, 6, 0].map(d => {
    const slots = (HOURS[d] || []).map(x => x.join(" – ")).join("  /  ") || T("closed"), me = d === today;
    return `<li class="flex justify-between gap-3 py-2.5 ${me ? "font-bold" : "text-slate-600"}"><span>${I18N[lang].days[d]}</span><span dir="ltr" class="tnum ${me ? "text-emerald-700" : ""}">${slots}</span></li>`;
  }).join("");
}

/* ---- Langue ---- */
function applyLang(l) {
  lang = l;
  try { localStorage.setItem("yc-lang", l); } catch (e) {}
  const h = document.documentElement; h.lang = l; h.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll("[data-wa]").forEach(a => a.href = waLink(T(a.dataset.wa)));
  document.querySelectorAll("[data-lang]").forEach(b => {
    const on = b.dataset.lang === l;
    b.className = "rounded-md px-2.5 py-1 text-xs font-bold " + (on ? "bg-night text-white" : "text-slate-600 hover:bg-white");
    b.setAttribute("aria-pressed", on);
  });
  $("#rating").textContent = T("rating", { r: CONFIG.rating });
  $("#dotP").textContent = T("dot_p", { n: new Intl.NumberFormat(NUM[l]).format(CONFIG.dotationMAD) });
  document.title = "YET-CHANGE – " + T("tagline");
  renderRates(); fillAlert(); updateStatus();
}
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => applyLang(b.dataset.lang));

/* ---- Liens fixes et démarrage ---- */
const place = encodeURIComponent(CONFIG.placeQuery);
$("#gps").href = $("#gps2").href = "https://www.google.com/maps/dir/?api=1&destination=" + place;
$("#mapFrame").src = "https://www.google.com/maps?q=" + place + "&output=embed";
$("#year").textContent = new Date().getFullYear();
applyLang(lang);
setInterval(updateStatus, 30000);
loadRates();
</script>
</body>
