      const c = (r[iC] || "").trim().toUpperCase(), v = toNum(r[iV]), t = parseDate(r[iT]);

    });
    CURS.forEach(c => { if (h[c]) hist[c] = h[c].sort((a, b) => a.t - b.t); });
    drawChart();
  } catch (e) { console.warn("Historique indisponible, courbe illustrative conservée :", e.message); }
}

/* ---- Tableau des taux ---- */
function renderRates() {
  $("#rows").innerHTML = CURS.map(c => {
    const r = R(c), none = state.loading ? "…" : "—";
    return `<tr class="border-t border-[#F2C94C]/10">
      <td class="py-3 ps-3"><div class="flex items-center gap-2"><span class="text-xl leading-none" aria-hidden="true">${FLAGS[c]}</span><b class="font-mono">${c}</b></div></td>
      <td class="px-2 py-3 text-end font-mono text-[13px] font-semibold tnum">${r ? fmt(r.achat) : none}</td>
      <td class="px-2 py-3 text-end font-mono text-[13px] font-semibold text-[#F2C94C] tnum">${r ? fmt(r.vente) : none}</td>
      <td class="py-3 pe-3 text-end"><button type="button" data-c="${c}" class="btn btn-gold btn-sm">${T("lock_s")}</button></td></tr>`;
  }).join("");
  let d = "";
  try { const dt = new Date(state.updated_at); if (!isNaN(dt)) d = new Intl.DateTimeFormat(LOC[lang], { dateStyle: "medium", timeStyle: "short", timeZone: "Africa/Casablanca" }).format(dt); } catch (e) {}
  $("#updated").textContent = d && !state.loading ? T("updated", { d }) : "";
  $("#src").classList.toggle("hidden", state.live || state.loading);
}
$("#rows").onclick = e => {
  const b = e.target.closest("[data-c]"); if (!b) return;
  $("#simCur").value = b.dataset.c; sim();
  $("#sim").scrollIntoView({ behavior: "smooth", block: "start" });
  setTimeout(() => $("#simAmt").focus({ preventScroll: true }), 400);
};

/* ---- Simulateur express ---- */
function sim() {
  const c = $("#simCur").value || CURS[0], r = R(c), buy = dir === "buy", v = num($("#simAmt").value) || 0;
  const rate = r ? (buy ? r.vente : r.achat) : 0, k = T(buy ? "th_sell" : "th_buy");
  const dev = unit === "dev" ? v : (rate ? v / rate : 0), mad = unit === "mad" ? v : v * rate;
  const [lab, out, u] = buy ? (unit === "dev" ? ["sim_pay", mad, "MAD"] : ["sim_get", dev, c]) : (unit === "dev" ? ["sim_get", mad, "MAD"] : ["sim_give", dev, c]);
  $("#simLab").textContent = T(lab);
  $("#simOut").textContent = rate ? f2(out) : "—";
  $("#simUnit").textContent = u;
  $("#simRate").textContent = rate ? T("rate_used", { c, r: fmt(rate), k }) : "";
  $("#big").hidden = !(dev >= THRESH[c]);
  $("#lock").href = waLink(rate && dev > 0 ? T("lock_msg", { a: fa(dev), c, r: fmt(rate), k }) : T("lock_day_msg", { c, r: rate ? fmt(rate) : "—" }));
  $("#uDev").textContent = c;
  $("#dBuy").setAttribute("aria-pressed", buy); $("#dSell").setAttribute("aria-pressed", !buy);
  $("#uDev").setAttribute("aria-pressed", unit === "dev"); $("#uMad").setAttribute("aria-pressed", unit === "mad");
}
$("#dBuy").onclick = () => { dir = "buy"; sim(); };
$("#dSell").onclick = () => { dir = "sell"; sim(); };
$("#uDev").onclick = () => { unit = "dev"; sim(); };
$("#uMad").onclick = () => { unit = "mad"; sim(); };
$("#simCur").onchange = sim; $("#simAmt").oninput = sim;

/* ---- Courbe interactive (SVG) : périodes 1M / 2M / 3M, axes, infobulle ---- */
const DF = o => { try { return new Intl.DateTimeFormat(LOC[lang], o); } catch (e) { return new Intl.DateTimeFormat("fr-FR", o); } };
function series(c) {
  const r = R(c); if (!r) return null;
  const a = hist[c];
  if (a && a.length) { const end = a[a.length - 1].t; return { real: true, pts: a.filter(p => p.t >= end - per * 864e5) }; }
  let seed = [...c].reduce((x, ch) => (x * 31 + ch.charCodeAt(0)) >>> 0, 7);
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296, w = [0];
  for (let i = 1; i < 91; i++) w.push(w[i - 1] + (rnd() - .5));
  const last = w[90], span = (Math.max(...w) - Math.min(...w)) || 1;
  return { real: false, pts: w.map(x => ({ v: r.vente * (1 + (x - last) / span * .03) })) };   // illustration ancrée sur le taux du jour
}
function curve(P) {
  let d = `M${P[0][0]},${P[0][1]}`;
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i - 1] || P[i], b = P[i], c = P[i + 1], e = P[i + 2] || c;
    d += `C${b[0] + (c[0] - a[0]) / 6},${b[1] + (c[1] - a[1]) / 6} ${c[0] - (e[0] - b[0]) / 6},${c[1] - (e[1] - b[1]) / 6} ${c[0]},${c[1]}`;
  }
  return d;
}
function setActive(i) {
  if (!CH) return;
  const { P, s, n, pl } = CH, p = s.pts[i], pct = (s.pts[n - 1].v - s.pts[0].v) / s.pts[0].v * 100;
  ["#gl", "#act"].forEach((id, k) => { const el = $(id); el.setAttribute(k ? "cx" : "x1", P[i][0]); if (!k) el.setAttribute("x2", P[i][0]); else el.setAttribute("cy", P[i][1]); el.setAttribute("visibility", "visible"); });
  const col = pct > 0 ? "text-emerald-400" : pct < 0 ? "text-rose-400" : "text-white", sg = new Intl.NumberFormat(NUM[lang], { minimumFractionDigits: 2, maximumFractionDigits: 2, signDisplay: "exceptZero" }).format(pct);
  $("#chTip").innerHTML = `<span class="font-bold text-[#F2C94C]">${DF({ day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" }).format(p.t)} : ${fmt(p.v)} MAD</span><span class="ms-3 font-bold ${col}">${pct > 0 ? "▲ " : pct < 0 ? "▼ " : ""}${sg} % ${T("m" + pl)}</span>`;
}
function hit(e) {
  if (!CH) return;
  const b = $("#chart svg").getBoundingClientRect(), x = (e.clientX - b.left) / b.width * CH.W;
  setActive(Math.max(0, Math.min(CH.n - 1, Math.round((x - CH.L) / (CH.W - CH.L - CH.Rr) * (CH.n - 1)))));
}
function drawChart() {
  const c = $("#chCur").value || CURS[0], s = series(c), r = R(c), box = $("#chart"), tip = $("#chTip"), pl = per / 30;
  document.querySelectorAll("[data-per]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.per === per));
  $("#lowL").textContent = T("low", { p: pl + "M" }); $("#highL").textContent = T("high", { p: pl + "M" });
  $("#stNow").textContent = r ? fmt(r.vente) : "—";
  $("#lockDay").href = waLink(T("lock_day_msg", { c, r: r ? fmt(r.vente) : "—" }));
  $("#chDemo").hidden = !s || s.real;
  const real = !!s && s.real && s.pts.length > 1, vals = s ? s.pts.map(p => p.v) : [];
  $("#stLow").textContent = real ? fmt(Math.min(...vals)) : "—";
  $("#stHigh").textContent = real ? fmt(Math.max(...vals)) : "—";
  CH = null; tip.hidden = !s || !s.real;
  if (!s) { box.innerHTML = ""; return; }
  if (s.real && !real) { box.innerHTML = ""; tip.textContent = T("ch_few"); return; }
  const w = box.clientWidth || 340, k = 600 / Math.max(280, w), fs = +(11.5 * k).toFixed(1), f1 = x => +(x * k).toFixed(1);
  const W = 600, H = Math.round(Math.max(200, Math.min(340, w * .62)) * k);
  const L = real ? Math.round(fs * 3.9) : Math.round(10 * k), Rr = Math.round(10 * k), Tp = Math.round(12 * k), B = real ? Math.round(fs * 2.6) : Math.round(10 * k), n = vals.length;
  const lo = Math.min(...vals), hi = Math.max(...vals), rng = (hi - lo) || 1;
  const X = i => L + i * (W - L - Rr) / (n - 1), Y = v => Tp + (1 - (v - lo) / rng) * (H - Tp - B);
  const P = vals.map((v, i) => [X(i), Y(v)]), d = curve(P), l = P[n - 1];
  const txt = `font-size="${fs}" fill="rgba(255,255,255,.7)" font-family="JetBrains Mono,monospace"`;
  const grid = [hi, (hi + lo) / 2, lo].map(v => `<line x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(242,201,76,.18)" stroke-dasharray="${f1(3)} ${f1(6)}"/>` + (real ? `<text x="${L - Math.round(fs * .6)}" y="${+(Y(v) + fs * .35).toFixed(1)}" text-anchor="end" ${txt}>${f2(v)}</text>` : "")).join("");
  let xl = "";
  if (real) {
    const f = DF({ day: "2-digit", month: "short", timeZone: "UTC" });
    xl = [...new Set([0, Math.round((n - 1) / 3), Math.round(2 * (n - 1) / 3), n - 1])].map(i => `<text x="${X(i)}" y="${H - Math.round(fs * .6)}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" ${txt}>${f.format(s.pts[i].t)}</text>`).join("");
  }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="block w-full" style="touch-action:pan-y;cursor:crosshair" role="img" aria-label="${c}"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C94C" stop-opacity=".34"/><stop offset="1" stop-color="#F2C94C" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}
    <path d="${d}L${l[0]},${H - B}L${P[0][0]},${H - B}Z" fill="url(#cg)"/>
    <path d="${d}" fill="none" stroke="#F2C94C" stroke-width="${f1(2.4)}" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px rgba(242,201,76,.75))"/>
    ${real ? P.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${f1(1.7)}" fill="#F2C94C"/>`).join("") : ""}
    <circle class="pulse" cx="${l[0]}" cy="${l[1]}" r="${f1(9)}" fill="#F2C94C"/>
    <line id="gl" x1="0" x2="0" y1="${Tp}" y2="${H - B}" stroke="rgba(255,255,255,.4)" visibility="hidden"/>
    <circle id="act" cx="0" cy="0" r="${f1(6)}" fill="#030826" stroke="#F2C94C" stroke-width="${f1(2.5)}" visibility="hidden"/></svg>`;
  if (real) { CH = { P, s, n, pl, W, L, Rr }; setActive(n - 1); }
}
$("#chCur").onchange = drawChart;
document.querySelectorAll("[data-per]").forEach(b => b.onclick = () => { per = +b.dataset.per; drawChart(); });
["pointermove", "pointerdown"].forEach(ev => $("#chart").addEventListener(ev, hit));
$("#chart").addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && CH) setActive(CH.n - 1); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (!$('[data-panel="2"]').hidden) drawChart(); }, 150); });

/* ---- Statut Ouvert / Fermé (Africa/Casablanca) ---- */
function nowMorocco() {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Casablanca", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { day: { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[g("weekday")], min: (parseInt(g("hour"), 10) % 24) * 60 + parseInt(g("minute"), 10) };
}
function getStatus() {
  const { day, min } = nowMorocco(), days = I18N[lang].days;
  for (const [o, c] of HOURS[day] || []) if (min >= toMin(o) && min < toMin(c)) return { open: true, sub: T("closes", { t: c }) };
  for (let i = 0; i < 8; i++) {
    const d = (day + i) % 7;
    for (const [o] of HOURS[d] || []) if (i > 0 || toMin(o) > min) return { open: false, sub: T("opens", { w: i === 0 ? T("w_today") : i === 1 ? T("w_tomorrow") : days[d], t: o }) };
  }
  return { open: false, sub: "" };
}
function updateStatus() {
  const s = getStatus(), today = nowMorocco().day;
  const cls = "items-center gap-2 rounded-full px-3 py-1 text-xs font-bold ring-1 " + (s.open ? "bg-emerald-400/15 text-emerald-300 ring-emerald-400/40" : "bg-[#E11D48]/15 text-rose-200 ring-[#E11D48]/60");
  const dot = `<span class="h-2 w-2 rounded-full ${s.open ? "animate-pulse bg-emerald-400" : "bg-[#E11D48]"}"></span>`;
  document.querySelectorAll("[data-pill]").forEach(el => {
    el.className = "inline-flex " + cls + (el.dataset.m ? " max-sm:hidden" : "");
    el.innerHTML = dot + T(s.open ? "open" : "closed") + (!el.dataset.m && s.sub ? " : " + s.sub : "");
  });
  $("#hours").innerHTML = [1, 2, 3, 4, 5, 6, 0].map(d => {
    const slots = (HOURS[d] || []).map(x => x.join(" – ")).join("  /  ") || T("closed"), me = d === today;
    return `<li class="flex justify-between gap-3 py-2 ${me ? "font-bold text-[#F2C94C]" : "text-white/70"}"><span>${I18N[lang].days[d]}</span><span dir="ltr" class="font-mono tnum">${slots}</span></li>`;
  }).join("");
}

/* ---- Projets ---- */
function renderProjects() {
  $("#proj").innerHTML = PRJ.map(([ic, n]) => `<article class="glass sheen flex flex-col gap-2 p-4">
    <div class="flex items-center gap-2.5"><span class="text-2xl" aria-hidden="true">${ic}</span><h3 class="font-bold leading-tight">${T("p" + n + "t")}</h3></div>
    <p class="flex-1 text-sm leading-relaxed text-white/75">${T("p" + n + "x")}</p>${n === 1 ? `<p class="rounded-lg border border-[#F2C94C]/25 bg-[#F2C94C]/5 px-3 py-2 text-xs leading-relaxed text-[#e6cf85]">${T("p1n")}</p>` : ""}
    <a href="${waLink(T("p_msg", { t: T("p" + n + "t") }))}" target="_blank" rel="noopener" class="btn btn-gold btn-sm self-start">${T("p_btn")}</a></article>`).join("");
}

/* ---- Onglets ---- */
function showTab(n) {
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === n));
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== n);
  if (n === "2") drawChart();
  if (n === "4") { const f = $("#mapFrame"); if (!f.getAttribute("src")) f.src = "https://www.google.com/maps?q=" + encodeURIComponent(CONFIG.mapQuery) + "&output=embed"; }
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => showTab(b.dataset.tab));

/* ---- Langue ---- */
function fillSelects() {
  [["#simCur", sim], ["#chCur", null]].forEach(([id]) => { const el = $(id), v = el.value || CURS[0]; el.innerHTML = CURS.map(c => `<option>${c}</option>`).join(""); el.value = v; });
}
function renderAll() { renderRates(); renderProjects(); fillSelects(); sim(); drawChart(); updateStatus(); }
function applyLang(l) {
  lang = l;
  try { localStorage.setItem("yc-lang", l); } catch (e) {}
  const h = document.documentElement; h.lang = l; h.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  document.title = "YET-CHANGE – " + T("tag");
  renderAll();
}
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => applyLang(b.dataset.lang));

/* ---- Arrière-plan « matrix » financier (canvas léger, 14 % d’opacité, colonnes de 34 px) ---- */
(function () {
  const cv = $("#fx"), ctx = cv.getContext && cv.getContext("2d"); if (!ctx) return;
  const SYM = ["€", "$", "£", "MAD", "CHF", "SAR", "AED", "10.74", "9.82", "12.89", "0%", "+0.45%"];
  const COL = ["#F2C94C", "#22D3EE", "#E3B93C", "#67E8F9"], fs = 12, GAP = 34;
  let W, H, drops = [], timer = null;
  const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; drops = Array.from({ length: Math.ceil(W / GAP) }, () => Math.random() * H / fs); };
  function frame() {
    ctx.fillStyle = "rgba(3,8,38,.14)"; ctx.fillRect(0, 0, W, H);
    ctx.font = "600 " + fs + "px 'JetBrains Mono',monospace";
    drops.forEach((y, i) => {
      ctx.fillStyle = COL[i % COL.length]; ctx.fillText(SYM[(Math.random() * SYM.length) | 0], i * GAP, y * fs);
      drops[i] = y * fs > H && Math.random() > .96 ? 0 : y + .45;
    });
  }
  const run = () => { if (!timer && !document.hidden) timer = setInterval(frame, innerWidth < 768 ? 80 : 55); }, stop = () => { clearInterval(timer); timer = null; };
  size(); addEventListener("resize", size);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { for (let i = 0; i < 60; i++) frame(); return; }
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : run()); run();
})();

/* ---- Démarrage ---- */
$("#gps").href = CONFIG.gpsUrl;
$("#year").textContent = new Date().getFullYear();
showTab("1");
applyLang(lang);
setInterval(updateStatus, 30000);
loadRates().then(loadHistory);
</script>
