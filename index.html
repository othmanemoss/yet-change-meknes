const fa = n => new Intl.NumberFormat(NUM[lang], { maximumFractionDigits: 2 }).format(n);

const R = c => state.loading ? null : state.rates[c];
const waLink = t => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(t)}`;
const toMin = s => { const [h, m] = s.split(":"); return parseInt(h, 10) * 60 + parseInt(m, 10); };

/* ---- Lecture du CSV Google Sheets (guillemets, virgule décimale), sinon taux de secours ---- */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
const toNum = v => parseFloat(String(v).trim().replace(/\s/g, "").replace(",", "."));
async function getCSV(url) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
  const res = await fetch(url, { signal: ctl.signal, cache: "no-store" });
  clearTimeout(to);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return parseCSV((await res.text()).replace(/^\uFEFF/, ""));
}
async function loadRates() {
  try {
    const rows = await getCSV(SHEET_CSV_URL);
    const head = (rows[0] || []).map(h => h.trim().toLowerCase());
    const col = (n, d) => head.indexOf(n) >= 0 ? head.indexOf(n) : d;
    const iD = col("devise", 0), iA = col("achat", 1), iV = col("vente", 2), found = {};
    (head.includes("devise") ? rows.slice(1) : rows).forEach(r => {
      const c = (r[iD] || "").trim().toUpperCase(), a = toNum(r[iA]), v = toNum(r[iV]);
      if (CURS.includes(c) && a > 0 && v > 0) found[c] = { achat: a, vente: v };
    });
    if (!Object.keys(found).length) throw new Error("Aucun taux lisible dans le tableau");
    const rates = {}; CURS.forEach(c => rates[c] = found[c] || null);
    state = { rates, updated_at: new Date().toISOString(), live: true, loading: false };
  } catch (e) { console.warn("Tableau Google Sheets inaccessible, taux de secours utilisés :", e.message); }
  finally { state.loading = false; renderAll(); }
}
async function loadHistory() {   // optionnel : Date, Devise, Vente
  if (!HISTORY_CSV_URL) return;
  try {
    const rows = (await getCSV(HISTORY_CSV_URL)).slice(1), h = {};
    rows.forEach(([d, c, v]) => { c = (c || "").trim().toUpperCase(); v = toNum(v); if (CURS.includes(c) && v > 0 && d) (h[c] = h[c] || []).push([d.trim(), v]); });
    CURS.forEach(c => { if (h[c]) hist[c] = h[c].sort((a, b) => a[0] < b[0] ? -1 : 1).slice(-91).map(x => x[1]); });
    histOk = Object.keys(hist).length > 0; drawChart();
  } catch (e) { console.warn("Historique indisponible, courbe illustrative conservée :", e.message); }
}

/* ---- Tableau des taux ---- */
function renderRates() {

/* ---- Simulateur express ---- */
function sim() {
  const c = $("#simCur").value || CURS[0], r = R(c), buy = dir === "buy", v = num($("#simAmt").value) || 0;
  const rate = r ? (buy ? r.vente : r.achat) : 0, k = T(buy ? "th_sell" : "th_buy");

  const [lab, out, u] = buy ? (unit === "dev" ? ["sim_pay", mad, "MAD"] : ["sim_get", dev, c]) : (unit === "dev" ? ["sim_get", mad, "MAD"] : ["sim_give", dev, c]);

}
$("#dBuy").onclick = () => { dir = "buy"; sim(); };

/* ---- Courbe 3 mois (SVG) ---- */
function series(c) {
  const r = R(c); if (!r) return null;
  if (hist[c] && hist[c].length > 1) return { pts: hist[c], real: true };
  let seed = [...c].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7);
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296, w = [0];
  for (let i = 1; i < 91; i++) w.push(w[i - 1] + (rnd() - .5));
  const last = w[90], span = (Math.max(...w) - Math.min(...w)) || 1;
  return { pts: w.map(x => r.vente * (1 + (x - last) / span * .03)), real: false };   // illustration ancrée sur le taux du jour
}
function curve(P) {
  let d = `M${P[0][0]},${P[0][1]}`;
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i - 1] || P[i], b = P[i], c = P[i + 1], e = P[i + 2] || c;
    d += `C${b[0] + (c[0] - a[0]) / 6},${b[1] + (c[1] - a[1]) / 6} ${c[0] - (e[0] - b[0]) / 6},${c[1] - (e[1] - b[1]) / 6} ${c[0]},${c[1]}`;
  }
  return d;
}
function drawChart() {
  const c = $("#chCur").value || CURS[0], s = series(c), r = R(c), box = $("#chart");
  $("#chDemo").hidden = !s || s.real;
  $("#stNow").textContent = r ? fmt(r.vente) : "—";
  $("#stLow").textContent = s && s.real ? fmt(Math.min(...s.pts)) : "—";
  $("#stHigh").textContent = s && s.real ? fmt(Math.max(...s.pts)) : "—";
  $("#lockDay").href = waLink(T("lock_day_msg", { c, r: r ? fmt(r.vente) : "—" }));
  if (!s) { box.innerHTML = ""; return; }
  const W = 600, H = 240, pad = 14, lo = Math.min(...s.pts), hi = Math.max(...s.pts), rng = (hi - lo) || 1;
  const P = s.pts.map((v, i) => [pad + i * (W - 2 * pad) / (s.pts.length - 1), H - pad - 8 - ((v - lo) / rng) * (H - 2 * pad - 24)]);
  const d = curve(P), l = P[P.length - 1];
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="block w-full" role="img" aria-label="${c}"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10B981" stop-opacity=".38"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></linearGradient></defs>
    ${[.25, .5, .75].map(f => `<line x1="0" x2="${W}" y1="${H * f}" y2="${H * f}" stroke="rgba(212,175,55,.14)" stroke-dasharray="3 7"/>`).join("")}
    <path d="${d}L${l[0]},${H}L${P[0][0]},${H}Z" fill="url(#cg)"/>
    <path d="${d}" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px rgba(16,185,129,.85))"/>
    <circle class="pulse" cx="${l[0]}" cy="${l[1]}" r="9" fill="#10B981"/><circle cx="${l[0]}" cy="${l[1]}" r="4.5" fill="#D4AF37"/></svg>`;
}
$("#chCur").onchange = drawChart;

/* ---- Statut Ouvert / Fermé (Africa/Casablanca) ---- */
function nowMorocco() {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Casablanca", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { day: { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[g("weekday")], min: (parseInt(g("hour"), 10) % 24) * 60 + parseInt(g("minute"), 10) };
}
function getStatus() {
  const { day, min } = nowMorocco(), days = I18N[lang].days;
  for (const [o, c] of HOURS[day] || []) if (min >= toMin(o) && min < toMin(c)) return { open: true, sub: T("closes", { t: c }) };
  for (let i = 0; i < 8; i++) {
    const d = (day + i) % 7;
    for (const [o] of HOURS[d] || []) if (i > 0 || toMin(o) > min) return { open: false, sub: T("opens", { w: i === 0 ? T("w_today") : i === 1 ? T("w_tomorrow") : days[d], t: o }) };
  }
  return { open: false, sub: "" };
}
function updateStatus() {
  const s = getStatus(), today = nowMorocco().day;
  const cls = "items-center gap-2 rounded-full px-3 py-1 text-xs font-bold ring-1 " + (s.open ? "bg-emerald-400/15 text-emerald-300 ring-emerald-400/40" : "bg-rose-400/15 text-rose-300 ring-rose-400/40");
  const dot = `<span class="h-2 w-2 rounded-full ${s.open ? "animate-pulse bg-emerald-400" : "bg-rose-400"}"></span>`;
  document.querySelectorAll("[data-pill]").forEach(el => {
    el.className = "inline-flex " + cls + (el.dataset.m ? " max-sm:hidden" : "");
    el.innerHTML = dot + T(s.open ? "open" : "closed") + (!el.dataset.m && s.sub ? " : " + s.sub : "");
  });
  $("#hours").innerHTML = [1, 2, 3, 4, 5, 6, 0].map(d => {
    const slots = (HOURS[d] || []).map(x => x.join(" – ")).join("  /  ") || T("closed"), me = d === today;
    return `<li class="flex justify-between gap-3 py-2 ${me ? "font-bold text-emerald-300" : "text-emerald-50/70"}"><span>${I18N[lang].days[d]}</span><span dir="ltr" class="font-mono tnum">${slots}</span></li>`;
  }).join("");
}

/* ---- Arrière-plan « matrix » discret (canvas léger, 6 % d’opacité) ---- */
(function () {
  const cv = $("#fx"), ctx = cv.getContext && cv.getContext("2d"); if (!ctx) return;
  const SYM = ["€", "$", "£", "MAD", "10.74"], fs = 15; let W, H, drops = [], timer = null;
  const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; drops = Array.from({ length: Math.ceil(W / 54) }, () => Math.random() * H / fs); };
  function frame() {
    ctx.fillStyle = "rgba(6,13,10,.16)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#10B981"; ctx.font = fs + "px 'JetBrains Mono',monospace";
    drops.forEach((y, i) => { ctx.fillText(SYM[(Math.random() * SYM.length) | 0], i * 54, y * fs); drops[i] = y * fs > H && Math.random() > .975 ? 0 : y + .5; });
  }
  const run = () => { if (!timer && !document.hidden) timer = setInterval(frame, 110); }, stop = () => { clearInterval(timer); timer = null; };
  size(); addEventListener("resize", size);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { for (let i = 0; i < 40; i++) frame(); return; }
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : run()); run();
})();
